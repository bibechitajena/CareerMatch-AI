
<!DOCTYPE html>
<html>
<head>
    <title>CareerMatch AI - Resume Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding: 60px 20px;
        }
        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }
        h1 { color: #2563eb; }
        input, button {
            margin: 20px 0;
            padding: 12px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>CareerMatch AI</h1>
    <h2>AI Resume Analyzer</h2>
    <p>Upload your resume to extract your skills.</p>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="resume" accept=".pdf" required>
        <br>
        <button type="submit">Analyze Resume</button>
    </form>
</div>
</body>
</html>
