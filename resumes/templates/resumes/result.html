
<!DOCTYPE html>
<html>
<head>
    <title>CareerMatch AI - Analysis Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ddd;
        }

        h1 { color: #2563eb; }

        .skill {
            display: inline-block;
            background: #e0ecff;
            color: #1d4ed8;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 20px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            color: white;
            background: #2563eb;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>CareerMatch AI</h1>
    <h2>Resume Analysis Results</h2>

    <h3>Extracted Skills</h3>

    {% if skills %}
        {% for skill in skills %}
            <span class="skill">{{ skill }}</span>
        {% endfor %}
    {% else %}
        <p>No skills detected in your resume.</p>
    {% endif %}

    <br>

    <a href="/">Analyze Another Resume</a>

</div>
</body>
</html>
