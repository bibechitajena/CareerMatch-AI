
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CareerMatch AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2563eb;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .helptext {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }

        ul.errorlist {
            color: #dc2626;
            font-size: 13px;
            margin: 8px 0;
            padding-left: 20px;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="register-container">

    <h1>CareerMatch AI</h1>

    <p class="subtitle">
        Create your account to get started
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <label for="{{ field.id_for_label }}">
                {{ field.label }}
            </label>

            {{ field }}

            {% if field.help_text %}
                <small class="helptext">
                    {{ field.help_text|safe }}
                </small>
            {% endif %}

            {{ field.errors }}

        {% endfor %}

        <button type="submit" class="register-btn">
            Create Account
        </button>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="/accounts/login/">Login</a>
    </p>

</div>

</body>
</html>
