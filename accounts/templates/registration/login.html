
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CareerMatch AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2563eb;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .errorlist {
            color: #dc2626;
            margin: 10px 0;
            padding-left: 20px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>CareerMatch AI</h1>

    <p class="subtitle">
        Welcome back! Login to your account.
    </p>

    <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
            <p class="errorlist">
                Invalid username or password. Please try again.
            </p>
        {% endif %}

        <label for="id_username">Username</label>
        <input
            type="text"
            name="username"
            id="id_username"
            required
            autocomplete="username"
        >

        <label for="id_password">Password</label>
        <input
            type="password"
            name="password"
            id="id_password"
            required
            autocomplete="current-password"
        >

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <p class="register-link">
        Don't have an account?
        <a href="/accounts/register/">Register</a>
    </p>

</div>

</body>
</html>
